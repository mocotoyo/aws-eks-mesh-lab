apiVersion: v1
kind: Service
metadata:
  name: cuentas
  namespace: mesh-lab
  labels:
    proyecto: mesh-lab
spec:
  selector:
    app: cuentas
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuentas-v1
  namespace: mesh-lab
  labels:
    proyecto: mesh-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cuentas
      version: v1
  template:
    metadata:
      labels:
        app: cuentas
        version: v1
      annotations:
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyMemory: 64Mi
        sidecar.istio.io/proxyCPULimit: 300m
        sidecar.istio.io/proxyMemoryLimit: 192Mi
    spec:
      containers:
      - name: app
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8080
        env:
        - name: VERSION
          value: v1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      serviceAccountName: cuentas
---
apiVersion: apps/v1
kind: Deployment
