apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: cuentas-get-autorizado
  namespace: mesh-lab
spec:
  selector:
    matchLabels:
      app: cuentas
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/mesh-lab/sa/pagos
              - cluster.local/ns/istio-ingress/sa/mesh-gateway
      to:
        - operation:
            methods: [GET]
            ports: ['8080']
